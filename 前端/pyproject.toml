[project]
name = "zero-carbon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai",
    "openpyxl>=3.1.5",
    "plotly>=6.9.0",
    "polars>=1.43.2",
    "streamlit>=1.60.0",
]

[project.scripts]
zero-carbon = "zero_carbon:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
